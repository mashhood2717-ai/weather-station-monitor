<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6, user-scalable=yes" />
  <title>Lightning &amp; Satellite</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --glass-bg: rgba(18, 23, 33, 0.66);
      --glass-border: rgba(255, 255, 255, 0.10);
      --on: #e6e9ee;
      --primary: #0ea5e9;
      --r: 14px;
    }
    html, body { margin: 0; height: 100%; background: #0A0A0A;
      font-family: Inter, system-ui, -apple-system, sans-serif; }
    #map { position: absolute; inset: 0; background: #0A0A0A; }

    /* ---- Glassmorphism for all Leaflet controls (matches dashboard) ---- */
    .leaflet-bar, .leaflet-control-layers, .ww-ltg-ctl, .ww-ltg-hist {
      background: var(--glass-bg) !important;
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border) !important;
      border-radius: var(--r) !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
      color: var(--on) !important;
      overflow: hidden;
    }
    .leaflet-bar a {
      background: transparent !important; color: var(--on) !important;
      border-bottom: 1px solid var(--glass-border) !important;
    }
    .leaflet-bar a:last-child { border-bottom: none !important; }
    .leaflet-bar a:hover { background: rgba(255, 255, 255, 0.10) !important; }
    .leaflet-control-layers-expanded { padding: 10px 12px !important; }
    .leaflet-control-layers label, .leaflet-control-layers-list span { color: var(--on) !important; }
    .ww-ltg-ctl, .ww-ltg-ctl > div { color: var(--on) !important; }
    .ww-ltg-hist input[type=range] { accent-color: var(--primary); }
    .leaflet-control-attribution {
      background: rgba(0, 0, 0, 0.45) !important; color: #7a828c !important;
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .leaflet-control-attribution a { color: #9aa3ad !important; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="ww-lightning.js?v=12"></script>
  <script>
    // Optional ?lat=&lon=&label= from the host app → center the ring/map there.
    var qs = new URLSearchParams(location.search);
    var qLat = parseFloat(qs.get('lat'));
    var qLon = parseFloat(qs.get('lon'));
    var qLabel = qs.get('label') || '';
    var hasLoc = isFinite(qLat) && isFinite(qLon);

    // Named "lightningMap" (not "map") so ww-lightning.js does NOT auto-attach;
    // we attach manually below. The app passes the user's location, so the map
    // stays centred on THEM (their alert rings) — no fitOnLoad jumping around.
    var lightningMap = L.map('map', { zoomControl: true, attributionControl: true })
      .setView(hasLoc ? [qLat, qLon] : [30.3753, 69.3451], hasLoc ? 9 : 6);

    var streetsBase = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19,
    }).addTo(lightningMap); // streets default (matches /pk portal + dashboard)

    // Embedded card (~320px) hides the place-search + history slider; full-screen
    // (tall viewport) shows them. Detected by viewport height — no app rebuild.
    var wwBig = window.innerHeight > 480;
    if (window.attachWWLightning) {
      window.attachWWLightning(lightningMap, {
        persist: false,    // ignore/never write localStorage (isolated from dashboards)
        search: wwBig,     // place-search box: full-screen only
        history: wwBig,    // history slider/player: full-screen only
        stations: false,   // no station markers/toggle
        sound: true,       // tick on new in-view strikes (needs one user tap to unlock audio)
        radar: true,       // show the 🌧️ toggle button
        radarOn: false,    // ...but OFF by default (user can turn it on)
        satellite: true,      // show the 🛰️ toggle button
        satelliteOn: false,   // ...but OFF by default (user can turn it on)
        lat: hasLoc ? qLat : undefined,   // ring/alert center = user location
        lon: hasLoc ? qLon : undefined,
        label: qLabel || undefined,
        // lightning is on by default; NO fitOnLoad (stays centred on the user)
      });
    }
  </script>
</body>
</html>
