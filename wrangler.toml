# Cloudflare Workers Configuration
# weatherlink-monitor/wrangler.toml

# ============================================================
# STAGING ENVIRONMENT (Default)
# Deploy: npx wrangler deploy
# URL: weatherlink-monitor-staging.mashhood2717.workers.dev
# ============================================================

name = "weatherlink-monitor-staging"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Account ID (get from Cloudflare dashboard)
account_id = "6c8e757f437498dc32b4a9d311b92af7"

# Workers Settings
workers_dev = true

# D1 Database Binding (Staging)
[[d1_databases]]
binding = "DB"
database_name = "weatherlink-monitor-staging"
database_id = "c86a9395-05a8-4dee-9d6e-acf000bd11ea"

# Static assets removed — the Worker is API-only now. The dashboards live on
# Cloudflare Pages (weatherwalay-dashboard / -staging / -react.pages.dev),
# which is the canonical hosting. Bundling the dashboard inside the Worker
# was causing version drift — Pages would have the latest code while the
# Worker served a stale snapshot from its last deploy.

# Cron Triggers - DISABLED for staging (manual testing only)
[triggers]
crons = []

# Environment Variables
[vars]
ENVIRONMENT = "staging"

# ============================================================
# PRODUCTION ENVIRONMENT
# Deploy: npx wrangler deploy --env production
# URL: weatherlink-monitor.mashhood2717.workers.dev
# ============================================================

[env.production]
name = "weatherlink-monitor"

[[env.production.d1_databases]]
binding = "DB"
database_name = "weatherlink-monitor"
database_id = "f075f3d2-753d-45e2-a94f-0b1c0ab7a60d"

[env.production.triggers]
# DISABLED - Cron causing excessive D1 reads (15.97B reads!)
# Re-enable with reduced frequency after optimizing database queries
# crons = ["7,22,37,52 * * * *"]
crons = []

[env.production.vars]
ENVIRONMENT = "production"

# Secrets (set via: wrangler secret put SECRET_NAME --env production)
#
# HubService auth changed to an RSA+AES encrypted envelope (see src/index.js).
# Plaintext Basic auth and `Authorization: Bearer <jwt>` are BOTH rejected now.
# All three of these are required for the Worker to authenticate:
#   HUBSERVICE_BASIC_AUTH     - account credential, formatted "loginParam:password"
#                               (encrypted into the login body as {credentials})
#   HUBSERVICE_BASIC_PASSWORD - app Basic password; encrypted with the rotating
#                               username "we@therwalay-<ms>" into the Authorization header
#   HUBSERVICE_PUBLIC_KEY     - hub's RSA public key, SPKI PEM. Literal "\n"
#                               escapes are accepted, so it can be stored single-line.
#
# HUBSERVICE_JWT            - optional pre-issued session JWT; only a stopgap, it
#                             cannot self-refresh and is ignored once expired.
# RESEND_API_KEY         - Get from https://resend.com (free tier: 100 emails/day)
# REPORT_EMAILS          - Comma-separated list of email recipients
# REPORT_FROM_EMAIL      - Sender email address (optional, needs domain verification)

# Routes (optional - for custom domain)
# [[routes]]
# pattern = "monitor.yourdomain.com/*"
# zone_name = "yourdomain.com"

# Static assets removed in production too — same reason as staging.
# Dashboards are served by Cloudflare Pages, not the Worker.

# Build Configuration
# [build]
# command = "cd dashboard-react && npm run build"

# Limits (Free Tier)
# Note: cpu_ms removed; free tier allows 10ms CPU time per invocation by default.
# The explicit limit was causing failures on heavy sync operations.
# Cloudflare enforces the free tier limit automatically.
